[mutmut]
# Run from this dir (make mutmut): cwd-relative source path keeps the mutant
# module name flat (find_*), matching what the tests import — hyphenated skill
# dirs cannot be dotted package paths, which is what a repo-root run breaks on.
source_paths=
    find_feature_envy.py
also_copy=
    test_find_feature_envy.py
    test_find_feature_envy_langs.py
# Clear the project addopts: coverage gate and doctest flags do not apply in mutants/.
pytest_add_cli_args=
    -o
    addopts=
    -x
    -q
on_dependency_change=
    rerun
