rubrics:
  - id: generated_task_executability
    artifact_file: _generated_artifacts_primary_
    artifact_selector:
      extensions: [".md"]
      path_patterns: ["tasks/issues/*.md"]
    prompt: |
      Evaluate whether this generated plan task is executable by an autonomous coding agent.
      Score 1.0 if it contains concrete context, explicit dependencies, functional requirements,
      acceptance criteria, required tests, and a clear AFK/HITL assignability reason.
      Score 0.7 if one of those elements is weak but the task is still implementable without guessing.
      Score 0.4 if two or more elements are vague, generic, or require unstated product decisions.
      Score 0.0 if the task is mostly a checklist, placeholder text, or cannot be implemented safely.
      Respond with JSON: {"passed": <bool>, "score": <float>, "reasoning": <one sentence citing artifact evidence>}

  - id: generated_no_bureaucratic_padding
    artifact_file: _generated_artifacts_primary_
    artifact_selector:
      extensions: [".md"]
      path_patterns: ["tasks/issues/*.md"]
    prompt: |
      Evaluate whether this task avoids bureaucratic padding and duplicated content.
      Good plan-it output uses each section for a distinct purpose: Context explains why,
      Use Cases describe who/when, Requirements define what must be true, Acceptance Criteria
      define observable pass/fail outcomes, and the Risk Assessment table and test subsections
      verify specific risks or requirements.
      Score 1.0 if the risk assessment table shows every category with a specific,
      task-bound reason for inclusion or exclusion, and active test subsections are
      distinct from requirements and acceptance criteria.
      Score 0.7 if one or two reasons are generic or there is minor content overlap.
      Score 0.4 if multiple reasons are tautological or copy-paste across categories,
      or if active test entries mechanically mirror acceptance criteria.
      Score 0.0 if the risk assessment section is missing, all reasons are identical,
      or the task is mostly duplicated boilerplate.
      Respond with JSON: {"passed": <bool>, "score": <float>, "reasoning": <one sentence citing artifact evidence>}

  - id: generated_tests_are_risk_scoped
    artifact_file: _generated_artifacts_primary_
    artifact_selector:
      extensions: [".md"]
      path_patterns: ["tasks/issues/*.md"]
    prompt: |
      Evaluate whether the Required Tests section's risk assessment and test specifications
      choose the smallest meaningful test set for the task.
      Score 1.0 if selected tests are tied to specific risks, requirements, or acceptance
      criteria, and the risk assessment shows a considered Yes/No for every category with
      a task-specific reason.
      Score 0.7 if test choices are mostly justified but one category is overbroad or
      the exclusion reason is tautological.
      Score 0.4 if broad tests such as E2E, performance, security, or observability are
      selected without a risk justification, or multiple exclusion reasons are generic.
      Score 0.0 if tests are generic, missing, or the risk assessment table is absent.
      Respond with JSON: {"passed": <bool>, "score": <float>, "reasoning": <one sentence citing artifact evidence>}
